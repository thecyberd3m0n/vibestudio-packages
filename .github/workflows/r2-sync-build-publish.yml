name: R2 sync, build & publish

# Every 6 hours: merge upstream, build only the packages that changed since the
# last publish (main / aarch64), and publish them to the R2 apt repo via aptly.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated packages to force-build (skips change detection)"
        required: false
        default: ""

permissions: {} # none by default; jobs opt in below

concurrency:
  # Serialize: the aptly DB in R2 must not be mutated by two runs at once.
  group: r2-publish
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/termux/termux-packages.git
  PUBLISHED_TAG: r2-published
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  sync-build-publish:
    permissions:
      contents: write # push merged master + move the r2-published tag
      issues: write # open an issue on merge conflict
    runs-on: ubuntu-26.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream
        id: sync
        run: |
          set -euo pipefail
          git config user.name "VibeStudio CI"
          git config user.email "packages@vibestudio.app"

          # Baseline = last published commit (tag), or current HEAD on first run.
          if git rev-parse -q --verify "refs/tags/${PUBLISHED_TAG}" >/dev/null; then
            BEFORE="$(git rev-parse "refs/tags/${PUBLISHED_TAG}^{commit}")"
          else
            BEFORE="$(git rev-parse HEAD)"
          fi
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"

          git remote add upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream master

          if ! git merge --no-edit upstream/master; then
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "after=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open issue on merge conflict
        if: steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream merge conflict ($(date -u +%Y-%m-%d))" \
            --body "Automatic merge of upstream/master into master failed. Resolve manually, then re-run the workflow." \
            --label "sync-conflict" || true

      - name: Stop if merge conflicted
        if: steps.sync.outputs.conflict == 'true'
        run: exit 1

      - name: Determine changed packages
        id: changes
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.packages }}" ]; then
            PKGS="${{ github.event.inputs.packages }}"
          else
            # Only main-repo packages (packages/<name>/...), deduplicated.
            PKGS="$(git diff --name-only "${{ steps.sync.outputs.before }}" "${{ steps.sync.outputs.after }}" -- 'packages/*/' \
              | awk -F/ 'NF>=3 {print $2}' | sort -u \
              | while read -r p; do [ -d "packages/$p" ] && echo "$p"; done | tr '\n' ' ')"
          fi
          echo "packages=$PKGS" >> "$GITHUB_OUTPUT"
          if [ -z "${PKGS// }" ]; then
            echo "No changed main packages to build."
          else
            echo "Changed packages: $PKGS"
          fi

      - name: Enable zram
        if: steps.changes.outputs.packages != ''
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      - name: Load Docker image
        if: steps.changes.outputs.packages != ''
        run: ./scripts/run-docker.sh true

      - name: Free additional disk space
        if: steps.changes.outputs.packages != ''
        run: ./scripts/free-space.sh

      - name: Build changed packages
        if: steps.changes.outputs.packages != ''
        run: |
          set -euo pipefail
          read -ra PKGS <<< "${{ steps.changes.outputs.packages }}"
          # Build in dependency order; deps already built are pulled from our own
          # R2 repo via -i, so only genuinely new/changed packages compile.
          mapfile -t ORDER < <(./scripts/buildorder.py "${PKGS[@]}" 2>/dev/null | awk '{print $1}' || printf '%s\n' "${PKGS[@]}")
          [ "${#ORDER[@]}" -gt 0 ] || ORDER=("${PKGS[@]}")
          ./scripts/run-docker.sh -d ./build-package.sh -i -I -C -a aarch64 "${ORDER[@]}"

      - name: Publish to R2
        if: steps.changes.outputs.packages != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rclone zstd gnupg unzip curl
          # Ubuntu's aptly (1.5.0) emits an empty x-amz-acl that R2 rejects; use 1.6.3.
          mkdir -p scripts/r2/bin
          curl -fsSL -o /tmp/aptly.zip \
            https://github.com/aptly-dev/aptly/releases/download/v1.6.3/aptly_1.6.3_linux_amd64.zip
          unzip -o /tmp/aptly.zip -d /tmp >/dev/null
          install -m755 /tmp/aptly_1.6.3_linux_amd64/aptly scripts/r2/bin/aptly
          ./scripts/r2/publish-to-r2.sh output

      - name: Advance published marker
        if: steps.changes.outputs.packages != '' && success()
        run: |
          set -euo pipefail
          git tag -f "${PUBLISHED_TAG}" "${{ steps.sync.outputs.after }}"
          git push origin HEAD:master
          git push -f origin "${PUBLISHED_TAG}"

      - name: Advance marker (no changes)
        if: steps.changes.outputs.packages == '' && success()
        run: |
          set -euo pipefail
          git tag -f "${PUBLISHED_TAG}" "${{ steps.sync.outputs.after }}"
          git push origin HEAD:master
          git push -f origin "${PUBLISHED_TAG}"
