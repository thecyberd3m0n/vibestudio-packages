name: R2 sync, build & publish

# Hourly: merge upstream termux-packages, build the main-repo packages that
# changed since the last publish (aarch64), publish them to the R2 apt repo.
#
# Only the package repos (SYNC_PATHS) are taken from upstream. Everything else
# (.github/, scripts/, repo.json, ...) always stays as on our master: it carries
# fork-specific changes, and GITHUB_TOKEN may not push workflow files anyway.
#
# Jobs:
#   sync    - merge upstream packages, push master, compute changed/removed packages
#   build   - one matrix job per package; deps come from our R2 repo via -i
#   publish - add all built debs to aptly, drop removed packages, move tag,
#             open/update a tracking issue for failures
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated packages to build (skips change detection)"
        required: false
        default: ""
      skip_sync:
        description: "Do not merge upstream first"
        type: boolean
        default: false

permissions: {} # none by default; jobs opt in below

concurrency:
  # The aptly DB in R2 must not be mutated by two runs at once.
  group: r2-publish
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/termux/termux-packages.git
  # Directories synced from upstream; all other paths are kept from our master.
  SYNC_PATHS: packages x11-packages root-packages
  PUBLISHED_TAG: r2-published
  TARGET_ARCH: aarch64

jobs:
  sync:
    permissions:
      contents: write # push merged master
      issues: write # merge-conflict issue
    runs-on: ubuntu-slim
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
      before: ${{ steps.sync.outputs.before }}
      matrix: ${{ steps.changes.outputs.matrix }}
      removed: ${{ steps.changes.outputs.removed }}
      count: ${{ steps.changes.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream and push
        id: sync
        env:
          SKIP_SYNC: ${{ github.event.inputs.skip_sync }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "VibeStudio CI"
          git config user.email "packages@vibestudio.app"

          if git rev-parse -q --verify "refs/tags/${PUBLISHED_TAG}" >/dev/null; then
            BEFORE="$(git rev-parse "refs/tags/${PUBLISHED_TAG}^{commit}")"
          else
            BEFORE="$(git rev-parse HEAD)"
          fi
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"

          if [ "$SKIP_SYNC" != "true" ]; then
            git remote add upstream "$UPSTREAM_REPO"
            git fetch --no-tags upstream master

            if git merge-base --is-ancestor upstream/master HEAD; then
              echo "Already up to date with upstream."
            else
              # Pathspec for everything that is NOT synced from upstream.
              KEEP=(.)
              for p in $SYNC_PATHS; do KEEP+=(":!$p"); done

              # Merge without committing; conflicts are handled below.
              if ! git merge --no-commit --no-ff upstream/master; then
                git rev-parse -q --verify MERGE_HEAD >/dev/null || { echo "::error::git merge failed"; exit 1; }
              fi

              # Outside SYNC_PATHS our master always wins: drop files upstream
              # added there and restore everything else (incl. conflicts) to HEAD.
              git diff --cached --name-only --no-renames --diff-filter=A HEAD -- "${KEEP[@]}" \
                | xargs -r -d '\n' git rm -q -f --
              git checkout HEAD -- "${KEEP[@]}"

              # Any conflict left now is inside a package dir and needs a human.
              if git diff --name-only --diff-filter=U | grep -q .; then
                git diff --name-only --diff-filter=U
                git merge --abort || true
                gh issue create \
                  --title "Upstream merge conflict ($(date -u +%Y-%m-%d))" \
                  --body "Automatic merge of upstream/master failed in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Resolve manually on master, then re-run." \
                  --label "sync-conflict" || true
                echo "::error::Upstream merge conflict"
                exit 1
              fi

              git commit -q -m "Merge upstream/master ($SYNC_PATHS)" \
                -m "Only $SYNC_PATHS are taken from upstream; all other paths are kept from master."
              git push origin HEAD:master
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine changed packages
        id: changes
        env:
          MANUAL: ${{ github.event.inputs.packages }}
        run: |
          set -euo pipefail
          BEFORE="${{ steps.sync.outputs.before }}"
          AFTER="${{ steps.sync.outputs.sha }}"

          if [ -n "${MANUAL// }" ]; then
            CHANGED="$(tr ' ' '\n' <<<"$MANUAL" | sed '/^$/d' | sort -u)"
            REMOVED=""
          else
            # Main-repo package dirs touched in the range; keep only those that still exist.
            ALL="$(git diff --name-only "$BEFORE" "$AFTER" -- packages/ | awk -F/ '$1=="packages" && NF>=3 {print $2}' | sort -u)"
            CHANGED="$(for p in $ALL; do [ -f "packages/$p/build.sh" ] && echo "$p"; done || true)"
            REMOVED="$(for p in $ALL; do [ -f "packages/$p/build.sh" ] || echo "$p"; done || true)"
          fi

          # Drop packages known to be broken (see scripts/r2/skip.list).
          SKIP="$(sed -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^$/d' scripts/r2/skip.list 2>/dev/null || true)"
          if [ -n "$SKIP" ] && [ -n "$CHANGED" ]; then
            CHANGED="$(grep -vxF -f <(printf '%s\n' $SKIP) <<<"$CHANGED" || true)"
          fi

          COUNT=$(sed '/^$/d' <<<"$CHANGED" | wc -l)
          MATRIX="$(sed '/^$/d' <<<"$CHANGED" | jq -R . | jq -cs .)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "removed=$(tr '\n' ' ' <<<"$REMOVED" | sed 's/ *$//')" >> "$GITHUB_OUTPUT"

          {
            echo "### Sync ${BEFORE:0:10} → ${AFTER:0:10}"
            echo "- build: $COUNT package(s)"
            if [ -n "$CHANGED" ]; then printf '  - %s\n' $CHANGED; fi
            if [ -n "$REMOVED" ]; then echo "- removed upstream:"; printf '  - %s\n' $REMOVED; fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: sync
    if: needs.sync.outputs.count != '0'
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        package: ${{ fromJson(needs.sync.outputs.matrix) }}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - name: Classify package
        id: info
        run: |
          set -euo pipefail
          big=false
          if grep -qFx "${{ matrix.package }}" scripts/big-pkgs.list; then big=true; fi
          echo "big=$big" >> "$GITHUB_OUTPUT"

      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      - name: Load Docker image
        run: ./scripts/run-docker.sh true

      - name: Free disk space
        if: steps.info.outputs.big == 'true'
        run: ./scripts/free-space.sh

      - name: Build ${{ matrix.package }}
        id: build
        run: |
          set -euo pipefail
          # -i/-I: pull already-published deps from our R2 repo (repo.json); a dep
          # that is not yet published falls back to being built from source.
          ./scripts/run-docker.sh ./build-package.sh -i -I -C -a "$TARGET_ARCH" "packages/${{ matrix.package }}"

      - name: Collect debs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          status=failure
          if [ "${{ steps.build.outcome }}" = "success" ]; then status=success; fi
          echo "${{ matrix.package }} $status" > "artifacts/result-${{ matrix.package }}.txt"
          # Only ship debs from a successful build; filenames may contain ':' so tar them.
          if [ "$status" = success ] && compgen -G 'output/*.deb' >/dev/null; then
            tar cf "artifacts/debs-${{ matrix.package }}.tar" -C output .
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-${{ matrix.package }}
          path: artifacts/
          retention-days: 3

  publish:
    needs: [sync, build]
    # Run even if some builds failed (publish what succeeded) or none were needed.
    if: always() && needs.sync.result == 'success'
    permissions:
      contents: write # move the r2-published tag
      issues: write # failure tracking issue
    runs-on: ubuntu-26.04
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        if: needs.sync.outputs.count != '0'
        with:
          pattern: build-*
          path: artifacts
          merge-multiple: true

      - name: Summarize build results
        id: results
        run: |
          set -euo pipefail
          mkdir -p debs
          ok=(); failed=()
          for r in artifacts/result-*.txt; do
            [ -f "$r" ] || continue
            read -r pkg status < "$r"
            if [ "$status" = success ]; then ok+=("$pkg"); else failed+=("$pkg"); fi
          done
          for t in artifacts/debs-*.tar; do [ -f "$t" ] && tar xf "$t" -C debs; done
          ndebs=$(find debs -name '*.deb' | wc -l)
          echo "ok=${ok[*]:-}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed[*]:-}" >> "$GITHUB_OUTPUT"
          echo "ndebs=$ndebs" >> "$GITHUB_OUTPUT"
          {
            echo "### Build results"
            echo "- succeeded (${#ok[@]}): ${ok[*]:-—}"
            echo "- failed (${#failed[@]}): ${failed[*]:-—}"
            echo "- debs to publish: $ndebs"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install publish tools
        if: steps.results.outputs.ndebs != '0' || needs.sync.outputs.removed != ''
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rclone zstd gnupg unzip curl dpkg-dev
          # Ubuntu's aptly 1.5 sends an empty x-amz-acl that R2 rejects; use 1.6.3.
          mkdir -p scripts/r2/bin
          curl -fsSL -o /tmp/aptly.zip https://github.com/aptly-dev/aptly/releases/download/v1.6.3/aptly_1.6.3_linux_amd64.zip
          unzip -oq /tmp/aptly.zip -d /tmp
          install -m755 /tmp/aptly_1.6.3_linux_amd64/aptly scripts/r2/bin/aptly

      - name: Publish to R2
        if: steps.results.outputs.ndebs != '0' || needs.sync.outputs.removed != ''
        run: |
          set -euo pipefail
          args=()
          for p in ${{ needs.sync.outputs.removed }}; do args+=(--remove "$p"); done
          if [ "${{ steps.results.outputs.ndebs }}" != "0" ]; then args+=(debs); fi
          ./scripts/r2/publish-to-r2.sh "${args[@]}"

      - name: Verify published index
        if: steps.results.outputs.ndebs != '0'
        run: |
          set -euo pipefail
          curl -fsS "${R2_PUBLIC_BASE_URL%/}/apt/termux-main/dists/stable/main/binary-${TARGET_ARCH}/Packages" \
            | awk '/^Package: /{p=$2} /^Version: /{print p"="$2}' | sort -u > /tmp/index
          missing=0
          while IFS= read -r f; do
            key="$(dpkg-deb -f "$f" Package)=$(dpkg-deb -f "$f" Version)"
            grep -qxF "$key" /tmp/index || { echo "::error::not in index: $key"; missing=1; }
          done < <(find debs -name '*.deb')
          [ $missing = 0 ]

      - name: Advance published marker
        run: |
          set -euo pipefail
          git config user.name "VibeStudio CI"
          git config user.email "packages@vibestudio.app"
          git tag -f "$PUBLISHED_TAG" "${{ needs.sync.outputs.sha }}"
          git push -f origin "refs/tags/$PUBLISHED_TAG"

      - name: Track failures in an issue
        if: steps.results.outputs.failed != ''
        env:
          FAILED: ${{ steps.results.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="CI: package build failures"
          body="$(printf 'Failed in [run %s](%s) at %s:\n\n' "${{ github.run_id }}" "$RUN_URL" "${{ needs.sync.outputs.sha }}"; for p in $FAILED; do printf -- '- `%s`\n' "$p"; done; printf '\nAdd persistent failures to `scripts/r2/skip.list` once triaged.\n')"
          num="$(gh issue list --label ci-failure --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --label ci-failure --body "$body"
          fi
